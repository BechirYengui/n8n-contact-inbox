services:
  n8n:
    image: n8nio/n8n:2.39.5
    restart: unless-stopped
    environment:
      - N8N_HOST=${DOMAIN}
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://${DOMAIN}/
      - N8N_EDITOR_BASE_URL=https://${DOMAIN}/
      - N8N_PROXY_HOPS=1
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-Europe/Paris}
      - N8N_PAYLOAD_SIZE_MAX=1
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=true
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - N8N_UNVERIFIED_PACKAGES_ENABLED=false
    volumes:
      - ./data/n8n:/home/node/.n8n
      - ../.build:/project/.build:ro
    # L'éditeur n'est PAS exposé au public : il n'écoute que sur la boucle
    # locale du serveur. On y accède par un tunnel SSH :
    #   ssh -L 5678:localhost:5678 user@serveur  puis  http://localhost:5678
    ports:
      - "127.0.0.1:${EDITOR_PORT:-5678}:5678"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      - DOMAIN=${DOMAIN}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../frontend:/srv/frontend:ro
      - ./data/caddy:/data
      - ./data/caddy-config:/config
    depends_on:
      - n8n
